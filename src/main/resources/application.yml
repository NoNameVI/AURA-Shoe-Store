# Shared configuration committed to Git.
# Do not place developer-specific credentials in this file.
spring:
  application:
    name: aura-store

  profiles:
    default: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    # Flyway owns every object inside the selected database schema.
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false

  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
