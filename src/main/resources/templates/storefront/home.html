<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AURA Store</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/header :: siteHeader}"></header>
<main class="page-shell">
    <section class="hero">
        <p class="eyebrow">AURA Shoe Store</p>
        <h1>Kiến trúc đã sẵn sàng cho trải nghiệm mua sắm.</h1>
        <p>Trang chủ hiện là skeleton Thymeleaf. Dữ liệu sản phẩm sẽ được nối qua ProductService.</p>
        <a class="primary-button" th:href="@{/products}">Xem sản phẩm</a>
    </section>
</main>
<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
