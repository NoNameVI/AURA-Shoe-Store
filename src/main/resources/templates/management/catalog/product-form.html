<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông tin sản phẩm | AURA Store</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/header :: siteHeader}"></header>
<main class="page-shell catalog-page">
    <div class="catalog-heading"><div><p class="eyebrow">Quản lý sản phẩm</p>
        <h1 th:text="${editId != null ? 'Sửa sản phẩm' : 'Thêm sản phẩm'}">Thông tin sản phẩm</h1>
        <p>Thông tin mẫu giày; biến thể, ảnh và trạng thái được quản lý sau khi lưu.</p></div>
        <a th:href="@{/management/products}">← Danh sách sản phẩm</a></div>
    <section class="page-card">
        <p class="form-message error" th:if="${error}" th:text="${error}"></p>
        <form class="catalog-form" th:object="${productForm}" method="post"
              th:action="${editId != null} ? @{/management/products/{id}(id=${editId})} : @{/management/products}">
            <div class="form-grid">
                <label>Tên sản phẩm <input th:field="*{productName}" maxlength="180" required></label>
                <label>Slug <input th:field="*{slug}" maxlength="200" pattern="[a-z0-9]+(-[a-z0-9]+)*" required></label>
                <label>Mã mẫu <input th:field="*{styleCode}" maxlength="100"></label>
                <label>Thương hiệu
                    <select th:field="*{brandId}" required><option value="">Chọn thương hiệu</option>
                        <option th:each="brand : ${brands}" th:value="${brand.id}" th:text="${brand.brandName}"></option>
                    </select>
                </label>
                <label>Danh mục
                    <select th:field="*{categoryId}" required><option value="">Chọn danh mục</option>
                        <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.categoryName}"></option>
                    </select>
                </label>
            </div>
            <label>Mô tả <textarea th:field="*{description}" rows="6" maxlength="3000"></textarea></label>
            <div class="validation-list" th:if="${#fields.hasErrors('*')}">
                <p th:each="item : ${#fields.errors('*')}" th:text="${item}">Lỗi dữ liệu</p>
            </div>
            <div class="actions">
                <button class="primary-button" type="submit" th:text="${editId != null ? 'Lưu thay đổi' : 'Tạo sản phẩm'}"></button>
                <a th:href="@{/management/products}">Hủy</a>
            </div>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
</body>
</html>
