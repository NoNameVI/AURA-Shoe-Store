<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | AURA Footwear</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="shop-page">
<header th:replace="~{fragments/header :: siteHeader}"></header>
<main class="auth-layout shop-container">
    <section class="auth-story" aria-label="AURA Footwear">
        <img th:src="@{/images/aura-editorial-hero.png}"
             alt="Giày AURA trong không gian tối giản">
        <div><p class="shop-kicker">AURA / FOOTWEAR</p><h1>Trở lại với<br><em>những bước đi riêng.</em></h1></div>
    </section>
    <section class="auth-panel">
        <p class="shop-kicker">TÀI KHOẢN CỦA BẠN</p>
        <h2>Đăng nhập</h2>
        <p>Tiếp tục hành trình cùng AURA bằng tài khoản của bạn.</p>
        <form class="auth-form" th:action="@{/login}" method="post">
            <p class="form-message error" th:if="${param.error}" role="alert">Tên đăng nhập, mật khẩu hoặc trạng thái tài khoản không hợp lệ.</p>
            <p class="form-message" th:if="${param.logout}">Bạn đã đăng xuất.</p>
            <label>TÊN ĐĂNG NHẬP HOẶC EMAIL
                <input name="username" autocomplete="username" required autofocus>
            </label>
            <label>MẬT KHẨU
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button class="primary-button" type="submit">Đăng nhập <span aria-hidden="true">↗</span></button>
        </form>
        <a class="shop-text-link" th:href="@{/}">Trở về cửa hàng</a>
    </section>
</main>
<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
</body>
</html>
